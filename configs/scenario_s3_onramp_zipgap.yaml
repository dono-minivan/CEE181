# S3: S1 geometry and demand with the zipper courtesy merge + gap seeking (experiment log E5b, E6).
# Candidate no-control baseline (option 1): X is stated against this merge's MEASURED capacity, not q_c.
scenario_id: S3_onramp_zipgap_nocontrol
demand_id: D3_peak_Xm103_r28        # X_m = q_tot / C_m(r=0.28); C_m = 1157 veh/h measured in E6
param_set: baseline
seed: 181                        # ramp stream uses seed + 1000
road:
  length_m: 3000.0
  lane_id: 0
sim:
  dt_s: 0.1
  record_every_s: 1.0
  max_time_s: 7200.0
arrivals:                        # mainline, at x = 0
  process: poisson
  profile:                       # [start_s, end_s, flow_veh_per_h]
    - [0, 600, 766]   # X_m = 0.92
    - [600, 1500, 858]   # X_m = 1.03
    - [1500, 2400, 525]   # X_m = 0.63
ramp:
  merge_start_m: 1500.0          # acceleration lane start
  merge_end_m: 1750.0            # 250 m acceleration lane, ends in a standing obstacle
  approach_length_m: 250.0       # ramp entrance (stop line / future meter) to merge_start
  b_safe_mps2: 4.0               # MOBIL safe-braking limit
  # Merge-behavior switches (PROVISIONAL, see docs/experiment_log.md E1):
  cooperative_yield: false       # mainline follower brakes (<= b) to let a ramp vehicle in
  yield_min_speed_ratio: 0.0     # ...only if v_ramp >= ratio * v_follower
  speed_adaptation: false        # ramp vehicle also follows the adjacent mainline leader
  lane_end_decel_mps2: null      # braking rate that triggers the lane-end stop (null -> IDM b)
  courtesy: zipper               # each lane-0 driver lets in at most one ramp vehicle (E5)
  gap_seeking: true              # ramp vehicles steer toward the larger adjacent lane-0 gap (E3, E5b)
  arrivals:
    process: poisson
    profile:
      - [0, 600, 298]
      - [600, 1500, 334]
      - [1500, 2400, 204]
# Virtual detectors (tmc.detectors). Controllers may read ONLY these (CLAUDE.md rule 2).
# Same layout in every control mode, so measurement definitions match across comparisons.
detectors:
  - {id: M_up,   kind: loop, position_m: 1200.0, lane_id: 0, interval_s: 30}  # mainline upstream of the merge
  - {id: M_down, kind: loop, position_m: 1900.0, lane_id: 0, interval_s: 30}  # 150 m past merge_end (ALINEA site)
  - {id: M_exit, kind: loop, position_m: 3000.0, lane_id: 0, interval_s: 30}  # downstream boundary
  - {id: R_dem,  kind: arrivals, boundary: ramp, interval_s: 30}                 # ramp demand (joins the queue)
  - {id: R_pass, kind: loop, position_m: 1260.0, lane_id: -1, interval_s: 30}    # 10 m past the ramp stop line
  - {id: R_merge, kind: loop, position_m: 1500.0, lane_id: -1, interval_s: 30}   # acceleration-lane start
